<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Letter Shapes</title>
<link rel="stylesheet" href="../../../styles/theme.css">
<link rel="stylesheet" href="../../../styles/style.css">
<link rel="stylesheet" href="../../../styles/speakable.css">
<script src="../../../components/menu.js" defer></script>
<style>
.ls-root{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;overflow:hidden;padding:clamp(8px,1.8vmin,18px) 14px;background:#fff8f0;}
.wrap{width:100%;max-width:560px;flex:1;display:flex;flex-direction:column;min-height:0;}
.ls-root h1{font-size:clamp(1.3em,4.4vmin,1.9em);text-align:center;margin-bottom:clamp(6px,1.2vmin,12px);color:#333;flex-shrink:0;}
.legend{display:flex;gap:clamp(7px,1.6vmin,12px);flex-wrap:wrap;justify-content:center;margin-bottom:clamp(8px,1.4vmin,16px);background:#fff;border-radius:14px;padding:9px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05);font-size:.82em;flex-shrink:0;}
.leg{display:flex;align-items:center;gap:6px;font-weight:600;}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;}
.c-line{background:#3498DB;}.c-curve{background:#27AE60;}.c-circle{background:#9B59B6;}.c-diag{background:#F39C12;}.c-dot{background:#E74C3C;}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:clamp(8px,1.6vmin,18px);flex-shrink:0;}
.tab{border:none;background:#f1eef8;color:#7b4fc0;font-weight:700;font-size:clamp(.85em,3vmin,1em);padding:clamp(7px,1.5vmin,11px) clamp(14px,4vmin,22px);border-radius:999px;cursor:pointer;}
.tab.on{background:#7b4fc0;color:#fff;box-shadow:0 3px 10px rgba(123,79,192,.3);}
.panel{background:#fff;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.10);padding:clamp(12px,2.6vmin,22px);flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;}
.panel-title{font-size:clamp(1em,3.4vmin,1.15em);font-weight:700;margin-bottom:clamp(10px,2vmin,16px);text-align:center;flex-shrink:0;}
.hl{color:#7b4fc0;}
.count{display:inline-block;margin-left:6px;background:#f1eef8;color:#7b4fc0;font-size:.78em;padding:.12em .55em;border-radius:999px;vertical-align:middle;}
.groups{margin-bottom:clamp(10px,2vmin,20px);flex-shrink:0;}
.grp{display:flex;align-items:center;gap:clamp(5px,1.4vmin,8px);margin-bottom:6px;flex-wrap:wrap;justify-content:center;}
.grplabel{font-size:.72em;color:#9ca3af;font-weight:700;width:100%;text-align:center;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.pick{width:clamp(34px,7.6vmin,40px);height:clamp(40px,8.6vmin,46px);border:2px solid #e6e3ef;background:#fff;border-radius:11px;font-size:clamp(1em,3.4vmin,1.3em);font-weight:800;cursor:pointer;color:#333;font-family:inherit;}
.pick.on{border-color:#7b4fc0;background:#f6f1fd;}
.shapepick{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:clamp(10px,2vmin,20px);}
.pick.shape{width:auto;padding:0 14px;height:clamp(38px,8vmin,44px);font-size:.95em;display:inline-flex;align-items:center;gap:7px;font-weight:700;}
.row{display:flex;gap:clamp(8px,2vmin,14px);flex-wrap:wrap;align-items:center;justify-content:center;}
.identify-row{gap:clamp(14px,4vmin,26px);}
.chips{max-width:250px;}
.glyph{text-align:center;}
.glyph svg{width:clamp(96px,28vmin,150px);height:auto;}
.fallback{font-size:clamp(72px,22vmin,120px);font-weight:800;color:#c9c4d6;line-height:1;}
.chip{border:2px solid #e6e3ef;background:#fff;border-radius:14px;padding:clamp(8px,1.8vmin,11px) clamp(12px,3vmin,16px);font-size:clamp(.9em,3.2vmin,1em);font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:#333;font-family:inherit;}
.chip .tick{visibility:hidden;color:#27AE60;}
.chip.tapped[data-has="true"]{border-color:#27AE60;background:#eafaf1;}
.chip.tapped[data-has="true"] .tick{visibility:visible;}
.chip.tapped[data-has="false"]{border-color:#E74C3C;background:#fdecea;}
.abc{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(5px,1.6vmin,9px);width:100%;max-width:360px;}
.letterbtn{aspect-ratio:1;border:2px solid #e6e3ef;background:#fff;border-radius:12px;font-size:clamp(1.1em,4vmin,1.5em);font-weight:800;display:flex;align-items:center;justify-content:center;color:#333;cursor:pointer;font-family:inherit;}
.letterbtn.found{border-color:#27AE60;background:#eafaf1;box-shadow:0 0 0 3px #d3f0e0;}
.letterbtn.wrong{border-color:#E74C3C;background:#fdecea;}
.slots{margin-bottom:clamp(12px,2.4vmin,20px);}
.slotwrap{text-align:center;}
.slot{width:clamp(48px,12vmin,70px);height:clamp(48px,12vmin,70px);border:3px dashed #cdcad9;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.62em;color:#b7b3c6;font-weight:700;}
.slot.filled{border-style:solid;border-color:#7b4fc0;background:#f6f1fd;}
.ordnum{font-size:.62em;color:#9ca3af;font-weight:700;margin-bottom:2px;}
.tile{width:clamp(48px,12vmin,70px);height:clamp(48px,12vmin,70px);border:2px solid #e6e3ef;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.tile.wrong{border-color:#E74C3C;background:#fdecea;}
.arrow{font-size:1.5em;color:#cdcad9;}
.hint{margin-top:clamp(12px,2.4vmin,18px);font-size:.85em;color:#9ca3af;text-align:center;}
.hint.done{color:#27AE60;font-weight:700;font-size:1em;}
.picklabel{font-size:.82em;color:#9ca3af;font-weight:700;}
</style>
</head>
<body>
<div class="nav-bar" data-home="../../lessons/" data-title="Letter Shapes" data-instruction="Explore the shapes that build each letter" data-no-links="standalone sandbox activity"></div>
<div class="game-area">
  <div class="ls-root">
    <div class="wrap">
      <h1 data-speakable-container>Letter Shapes ✏️🔷</h1>
      <div class="legend" data-speakable-container>
        <span class="leg"><span class="sw c-line"></span>line</span>
        <span class="leg"><span class="sw c-curve"></span>curve</span>
        <span class="leg"><span class="sw c-circle"></span>circle</span>
        <span class="leg"><span class="sw c-diag"></span>diagonal</span>
        <span class="leg"><span class="sw c-dot"></span>dot</span>
      </div>
      <div class="tabs">
        <button class="tab on" data-mode="identify">Identify</button>
        <button class="tab" data-mode="match">Match</button>
        <button class="tab" data-mode="order">Order</button>
      </div>
      <div class="panel" id="ls-panel" data-speakable-container></div>
    </div>
  </div>
</div>
<script type="module" src="../../../components/speech/speech-ui.js"></script>
<script type="module">
import '../../../components/speech/speakable.js';
import { initLetterShapes } from '../../../ui/letter-shapes/letter-shapes-ui.js';
initLetterShapes();
</script>
<script>window.ACTIVITY_ID='letter-shapes';</script>
<script src="../../../components/adult-prompts/adult-prompts-ui.js" defer></script>
</body>
</html>
