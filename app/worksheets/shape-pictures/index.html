<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape Pictures</title>
<link rel="stylesheet" href="../../../styles/theme.css">
<link rel="stylesheet" href="../../../styles/panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
#panel{width:240px;min-width:240px;}
#panel-header a{color:#1d8fd8;}
#panel-header h2{font-size:1.2em;}
#panel-header p{font-size:0.8em;color:#888;margin-top:6px;line-height:1.4;}
#shadow-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #ddd;font-size:0.95em;color:#333;cursor:pointer;flex-shrink:0;}
#shadow-row input{width:18px;height:18px;accent-color:#3b4a57;cursor:pointer;}
#panel-list{overflow-y:auto;flex:1;padding:8px 0;}
#btn-print{background:#1d8fd8;color:white;border:none;border-radius:12px;padding:14px;font-size:1.1em;font-family:inherit;font-weight:bold;cursor:pointer;margin:12px 16px 16px;flex-shrink:0;}
#btn-print:hover{background:#1774b0;}
.panel-item{display:flex;align-items:center;gap:10px;padding:8px 16px;}
.panel-item:hover{background:#e8e8e8;}
.panel-item input{width:18px;height:18px;cursor:pointer;accent-color:#1d8fd8;flex-shrink:0;}
.panel-item label{cursor:pointer;font-size:0.95em;color:#333;flex:1;}
.sp-dots{color:#1d8fd8;font-size:0.8em;letter-spacing:2px;white-space:nowrap;}
#main{flex:1;overflow-y:auto;background:#eef3f6;}
#sheet{display:flex;flex-direction:column;}
.worksheet-item{display:flex;flex-direction:column;gap:10px;height:80vh;padding:16px;border-bottom:2px dashed #ccc;}
.sp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.sp-head h3{font-size:1.3em;color:#1f2a33;}
.sp-frame{flex:1;min-height:55%;background:#8fcdee;border-radius:14px;padding:10px;}
.sp-pic{display:block;width:100%;height:100%;background:#fff;border-radius:10px;}
.shadow .sp-pic g{fill:#3b4a57;stroke:#3b4a57;}
.shadow .sp-pic g *{fill:#3b4a57;}
.sp-pieces{list-style:none;display:flex;flex-wrap:wrap;gap:6px;}
.sp-pieces li{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d5e2ea;border-radius:8px;padding:3px 8px 3px 4px;font-size:0.85em;color:#1f2a33;}
.sp-pieces svg{width:22px;height:22px;flex:none;}
#empty-msg{padding:40px;text-align:center;color:#aaa;font-style:italic;font-size:1.1em;}
@media (max-width:600px){
  body{flex-direction:column;height:auto;overflow:auto;}
  #panel{width:100%;min-width:0;max-height:45vh;border-right:none;border-bottom:2px solid #ddd;}
  #main{overflow:visible;}
  .worksheet-item{height:auto;}
  .sp-frame{height:auto;}
  .sp-pic{height:auto;}
}
@page{size:A4;margin:12mm;}
@media print{
  #panel{display:none;}
  body{display:block;overflow:visible;height:auto;background:#fff;}
  #main{overflow:visible;background:#fff;}
  #sheet{display:block;}
  .worksheet-item{height:132mm;break-inside:avoid;page-break-inside:avoid;border:none;padding:4mm 0;overflow:hidden;}
  .sp-frame{min-height:0;}
  #empty-msg{display:none;}
  .sp-frame,.sp-pic,.sp-pieces li{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div id="panel">
  <div id="panel-header">
    <a href="../../worksheets/">&#127968; Worksheets</a>
    <h2>Shape Pictures</h2>
    <p>Tick pictures to build with the wooden shapes. Print them, or keep this screen open while building.</p>
  </div>
  <label id="shadow-row"><input type="checkbox" id="shadow-toggle">Shadow</label>
  <div id="panel-list"></div>
  <button id="btn-print">&#128438; Print</button>
</div>
<div id="main">
  <div id="sheet">
    <p id="empty-msg">Select pictures from the list to build your worksheet.</p>
  </div>
</div>
<script type="module">
import { init } from '../../../ui/shape-pictures/shape-pictures-ui.js';
init('../../../content/shape-pictures/shape-pictures.json');
</script>
</body>
</html>
